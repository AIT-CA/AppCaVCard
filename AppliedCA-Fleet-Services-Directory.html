<title>Fleet Services Directory | Applied Canada</title>
<style>
  /* ===== BRAND COLOURS — change these two lines to restyle the whole page ===== */
  :root {
    --brand-navy: #1F1A6B;   /* header, headings, buttons */
    --brand-teal: #01757F;   /* accents, links, card borders */
    --ink: #1c1d26;
    --muted: #5b5f6e;
    --line: #dcdfe8;
    --bg: #f4f5f9;
    --card: #ffffff;
    --warn-bg: #fff4d6;
    --warn-ink: #6b4a00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.45; }
  header { background: var(--brand-navy); color: #fff; border-bottom: 5px solid var(--brand-teal); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  .head-inner { display: flex; align-items: center; gap: 24px; padding: 18px 0; flex-wrap: wrap; }
  .logo { color: #fff; text-decoration: none; }
  .logo img { height: 40px; display: block; }
  .logo img[hidden], .logo .fallback[hidden] { display: none; }
  .logo .fallback { font-size: 28px; font-weight: 700; letter-spacing: .5px; }
  .head-title h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .head-title p { margin: 2px 0 0; font-size: 14px; opacity: .85; }
  main { padding: 28px 0 48px; }
  .banner { border-radius: 8px; padding: 12px 16px; margin-bottom: 18px; font-size: 14px; }
  .banner.sample { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid #ecd48a; }
  .banner.notice { background: #e8f3f4; color: #07454b; border: 1px solid #bfdde0; }
  .picker { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; gap: 16px; align-items: end; flex-wrap: wrap; }
  .picker label { display: block; font-weight: 600; color: var(--brand-navy); margin-bottom: 6px; }
  .picker select { font-size: 16px; padding: 10px 12px; min-width: 320px; max-width: 100%; border: 1px solid #b9bdcc; border-radius: 6px; background: #fff; color: var(--ink); }
  .picker select:focus, button:focus-visible { outline: 3px solid var(--brand-teal); outline-offset: 1px; }
  button { font: inherit; background: var(--brand-navy); color: #fff; border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; }
  button.secondary { background: #fff; color: var(--brand-navy); border: 1px solid var(--brand-navy); }
  #centre-info { margin: 24px 0 14px; display: none; }
  #centre-info h2 { margin: 0; color: var(--brand-navy); font-size: 22px; }
  #centre-info p { margin: 2px 0 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 16px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .picker select { min-width: 0; width: 100%; } }
  .card { background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--brand-teal); border-radius: 10px; padding: 16px 18px; }
  .card h3 { margin: 0 0 10px; font-size: 17px; color: var(--brand-navy); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; background: #e8f3f4; color: #07454b; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .vendor + .vendor { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 12px; }
  .vendor .name { font-weight: 700; font-size: 16px; }
  .vendor dl { margin: 6px 0 0; display: grid; grid-template-columns: 82px 1fr; gap: 3px 10px; font-size: 14px; }
  .vendor dt { color: var(--muted); }
  .vendor dd { margin: 0; word-break: break-word; white-space: pre-line; }
  .vendor a { color: var(--brand-teal); font-weight: 600; text-decoration: none; }
  .vendor a:hover { text-decoration: underline; }
  .none { color: var(--muted); font-size: 14px; }
  .none strong { color: var(--ink); }
  footer { color: var(--muted); font-size: 13px; margin-top: 28px; }
  .actions { margin-top: 18px; display: none; gap: 10px; }
  @media print {
    header { border-bottom: 2px solid #000; }
    .picker, .actions, button { display: none !important; }
    body { background: #fff; }
    .card { break-inside: avoid; }
  }
</style>

</main>

/* ==========================================================================
   PAGE LOGIC — no need to edit below this line.
   ========================================================================== */

const $ = (id) => document.getElementById(id);
const select = $("centre");
const results = $("results");

function el(tag, props, children) {
  const node = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "text") node.textContent = props[k];
    else node.setAttribute(k, props[k]);
  }
  (children || []).forEach((c) => c && node.appendChild(c));
  return node;
}

function row(dt, ddNode) {
  return [el("dt", { text: dt }), el("dd", null, [ddNode])];
}

function phoneLink(p) {
  const digits = p.replace(/[^\d+]/g, "");
  return el("a", { href: "tel:" + digits, text: p });
}

function vendorBlock(v) {
  const dl = el("dl");
  const add = (label, node) => row(label, node).forEach((n) => dl.appendChild(n));
  if (v.contact) add("Contact", document.createTextNode(v.contact));
  if (v.phone)   add("Phone", phoneLink(v.phone));
  if (v.email)   add("Email", el("a", { href: "mailto:" + v.email, text: v.email }));
  if (v.address) add("Address", document.createTextNode(v.address));
  if (v.notes)   add("Notes", document.createTextNode(v.notes));
  return el("div", { class: "vendor" }, [el("div", { class: "name", text: v.vendor }), dl]);
}

function serviceCard(service, vendors, isNational) {
  const title = el("h3", null, [el("span", { text: service.label })]);
  if (vendors.length && isNational && !vendors[0].message) title.appendChild(el("span", { class: "tag", text: "National program" }));
  const card = el("article", { class: "card" }, [title]);
  if (vendors.length) {
    vendors.forEach((v) => card.appendChild(v.message ? el("p", { class: "none", text: v.message }) : vendorBlock(v)));
  } else {
    const fc = CONFIG.fleetContact;
    const bits = [fc.name, fc.phone, fc.email].filter(Boolean).join(" · ");
    card.appendChild(el("p", { class: "none" }, [
      el("strong", { text: "No vendor on file. " }),
      document.createTextNode("Please check your Element ONE app for Element approved vendor in your area.")
    ]));
  }
  return card;
}

function render(num) {
  results.replaceChildren();
  const centre = CENTRES.find((c) => c.num === num);
  $("centre-info").style.display = centre ? "block" : "none";
  $("actions").style.display = centre ? "flex" : "none";
  if (!centre) return;

  $("centre-title").textContent = "Service Centre " + centre.num + " – " + centre.name;
  $("centre-sub").textContent = centre.city || "";

  SERVICES.forEach((s) => {
    const own = (centre.services && centre.services[s.id]) || [];
    const fallback = NATIONAL[s.id] || [];
    const useNational = own.length === 0 && fallback.length > 0;
    results.appendChild(serviceCard(s, useNational ? fallback : own, useNational));
  });
}

function init() {
  CENTRES.slice().sort((a, b) => a.num.localeCompare(b.num, undefined, { numeric: true })).forEach((c) => {
    select.appendChild(el("option", { value: c.num, text: c.num + " – " + c.name + (c.city ? " (" + c.city + ")" : "") }));
  });

  $("sample-banner").hidden = !CONFIG.sampleData;
  if (CONFIG.notice) { $("notice").textContent = CONFIG.notice; $("notice").hidden = false; }
  $("footer").textContent = "Maintained by Business Services. Last updated " + CONFIG.lastUpdated + ". Spot something out of date? Contact " + CONFIG.fleetContact.name + (CONFIG.fleetContact.email ? " at " + CONFIG.fleetContact.email : "") + ".";

  const img = $("logo-img");
  const showFallback = () => { img.hidden = true; $("logo-fallback").hidden = false; };
  img.addEventListener("error", showFallback);
  if (img.complete && img.naturalWidth === 0) showFallback();

  select.addEventListener("change", () => {
    history.replaceState(null, "", select.value ? "#centre=" + encodeURIComponent(select.value) : location.pathname + location.search);
    render(select.value);
  });
  $("print-btn").addEventListener("click", () => window.print());
  $("copy-btn").addEventListener("click", (e) => {
    const done = () => { e.target.textContent = "Link copied"; setTimeout(() => (e.target.textContent = "Copy link to this service centre"), 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, () => {});
  });

  const m = location.hash.match(/centre=([^&]+)/);
  if (m) {
    const want = decodeURIComponent(m[1]);
    if (CENTRES.some((c) => c.num === want)) { select.value = want; render(want); }
  }
}
init();
